<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enklr Whiteboard</title>
<script>
  /* Same pre-paint theme flash guard as the main app's src/index.html — reads the SAME
     kanbanflow_theme localStorage key, so a user who set dark mode in the main app gets a
     dark-themed standalone whiteboard too, with no flash of the wrong theme either way. */
  (function(){
    try{
      var saved = localStorage.getItem('kanbanflow_theme');
      if(saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    }catch(e){ /* localStorage unavailable — fall back to light */ }
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='0' y='0' width='24' height='24' fill='%230c66e4'/%3E%3Crect x='5' y='6' width='4' height='12' rx='1' fill='white'/%3E%3Crect x='10.5' y='6' width='4' height='7' rx='1' fill='white' opacity='.85'/%3E%3Crect x='16' y='6' width='4' height='10' rx='1' fill='white' opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Standalone Whiteboard tool (enklr.app/tools/whiteboard) — a genuinely separate, self-contained
     page, NOT the in-app Collaborative Whiteboard (modals/whiteboard.js). No login, no backend, no
     SSE/broadcast: every drawn element lives only in this browser's own localStorage. Reuses the
     in-app feature's own toolbar markup and kf-wb-* CSS classes verbatim so the drawing experience
     looks and feels identical, plus .kf-modal-full/.kf-overlay-full — the same "fullscreen, no
     backdrop-dismiss" shape PORTALS.md's own end-user Portal home page uses — since this page IS the
     whole browser tab, not an overlay floating above some other app shell. See CLAUDE.md/WHITEBOARD.md
     for how this differs from the collaborative in-app version. -->
<div class="kf-overlay kf-overlay-full" id="wbStandaloneOverlay">
  <div class="kf-modal kf-modal-full kf-whiteboard-modal" role="dialog" aria-modal="true">
    <div class="kf-modal-header">
      <h2>Whiteboard <span class="kf-wb-standalone-badge" title="Drawn here stays only in this browser — nothing is uploaded or shared.">local only</span></h2>
      <div class="kf-modal-header-actions" id="whiteboardToolbar">
        <div class="kf-wb-tool-stack">
          <div class="kf-wb-tool-row">
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="select" id="wbToolSelect" title="Select — click a shape to select it, drag to move. Shift-click to select multiple shapes and move them together"><span class="kf-icon" data-icon="cursorArrow" data-size="16"></span></button>
          </div>
        </div>
        <div class="kf-wb-tool-stack">
          <div class="kf-wb-tool-row">
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="curve" id="wbToolCurve" title="Smooth Curve — click to place points, Space to finish, click near the start point to close &amp; fill"><span class="kf-icon" data-icon="curve" data-size="16"></span></button>
          </div>
          <div class="kf-wb-tool-row">
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="pen" id="wbToolPen" title="Pen"><span class="kf-icon" data-icon="pen" data-size="16"></span></button>
          </div>
        </div>
        <div class="kf-wb-tool-stack">
          <div class="kf-wb-tool-row">
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="text" id="wbToolText" title="Text Box"><span class="kf-icon" data-icon="textBox" data-size="16"></span></button>
          </div>
          <div class="kf-wb-tool-row">
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="connector" id="wbToolConnector" title="Connector Line"><span class="kf-icon" data-icon="connector" data-size="16"></span></button>
          </div>
        </div>
        <div class="kf-wb-tool-stack">
          <div class="kf-wb-tool-row">
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="rect" id="wbToolRect" title="Rectangle"><span class="kf-icon" data-icon="shapeRect" data-size="16"></span></button>
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="circle" id="wbToolCircle" title="Circle"><span class="kf-icon" data-icon="shapeCircle" data-size="16"></span></button>
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="oval" id="wbToolOval" title="Oval"><span class="kf-icon" data-icon="shapeOval" data-size="16"></span></button>
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="triangle" id="wbToolTriangle" title="Triangle"><span class="kf-icon" data-icon="shapeTriangle" data-size="16"></span></button>
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="diamond" id="wbToolDiamond" title="Diamond"><span class="kf-icon" data-icon="shapeDiamond" data-size="16"></span></button>
          </div>
          <div class="kf-wb-tool-row">
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="rect-filled" id="wbToolRectFilled" title="Filled Rectangle"><span class="kf-icon" data-icon="shapeRectFilled" data-size="16"></span></button>
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="circle-filled" id="wbToolCircleFilled" title="Filled Circle"><span class="kf-icon" data-icon="shapeCircleFilled" data-size="16"></span></button>
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="oval-filled" id="wbToolOvalFilled" title="Filled Oval"><span class="kf-icon" data-icon="shapeOvalFilled" data-size="16"></span></button>
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="triangle-filled" id="wbToolTriangleFilled" title="Filled Triangle"><span class="kf-icon" data-icon="shapeTriangleFilled" data-size="16"></span></button>
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="diamond-filled" id="wbToolDiamondFilled" title="Filled Diamond"><span class="kf-icon" data-icon="shapeDiamondFilled" data-size="16"></span></button>
          </div>
        </div>
        <div class="kf-wb-tool-stack">
          <div class="kf-wb-tool-row">
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-tool" data-tool="eraser" id="wbToolEraser" title="Eraser"><span class="kf-icon" data-icon="eraser" data-size="16"></span></button>
          </div>
          <div class="kf-wb-tool-row">
            <button type="button" class="kf-btn kf-btn-ghost" id="wbClearAllBtn" title="Clear All — erases everything on this whiteboard"><span class="kf-icon" data-icon="trash" data-size="16"></span></button>
          </div>
        </div>
        <div class="kf-wb-tool-stack">
          <div class="kf-wb-tool-row">
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-toggle" id="wbGridToggleBtn" title="Show Grid — a local view aid only"><span class="kf-icon" data-icon="grid" data-size="16"></span></button>
          </div>
          <div class="kf-wb-tool-row">
            <button type="button" class="kf-btn kf-btn-ghost kf-wb-toggle" id="wbSnapToggleBtn" title="Snap to Grid — a local drawing aid only"><span class="kf-icon" data-icon="snapGrid" data-size="16"></span></button>
          </div>
        </div>
        <div class="kf-header-divider-light"></div>
        <div class="kf-wb-slider-stack">
          <div class="kf-wb-slider-group">
            <label for="wbPenWidth">Size</label>
            <input type="range" id="wbPenWidth" min="1" max="20" value="3" title="Pen width">
            <svg class="kf-wb-indicator" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <circle class="kf-wb-indicator-max" cx="12" cy="12" r="10"/>
              <circle id="wbPenWidthDot" cx="12" cy="12" r="1.5" fill="#000000"/>
            </svg>
          </div>
          <div class="kf-wb-slider-group">
            <label for="wbPenOpacity">Opacity</label>
            <input type="range" id="wbPenOpacity" min="1" max="100" value="100" title="Opacity">
            <svg class="kf-wb-indicator" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <circle class="kf-wb-indicator-max" cx="12" cy="12" r="10"/>
              <circle id="wbPenOpacityDot" cx="12" cy="12" r="10" fill="#000000" fill-opacity="1"/>
            </svg>
          </div>
        </div>
        <div class="kf-header-divider-light"></div>
        <div class="kf-wb-palette" id="wbPalette"></div>
        <div class="kf-header-divider-light"></div>
        <div class="kf-export-as-wrap">
          <button class="kf-btn kf-btn-ghost" id="wbExportAsBtn" title="Export As..."><span class="kf-icon" data-icon="download" data-size="14"></span>Export As...</button>
          <div class="kf-export-as-panel hidden" id="wbExportAsPanel">
            <button type="button" class="kf-export-as-option" data-export-type="svg">Export as SVG</button>
            <button type="button" class="kf-export-as-option" data-export-type="png">Export as PNG</button>
          </div>
        </div>
      </div>
    </div>

    <div class="kf-wb-body" id="wbCanvasView">
      <div class="kf-wb-canvas-wrap" id="wbCanvasWrap">
        <svg id="wbCanvas" class="kf-wb-canvas" viewBox="0 0 1600 900" preserveAspectRatio="xMinYMin meet">
          <defs>
            <marker id="kf-wb-dot-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto"><circle cx="5" cy="5" r="3" fill="var(--kf-surface)" stroke="#5243aa" stroke-width="1.6"/></marker>
            <marker id="kf-wb-dot-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><circle cx="5" cy="5" r="3" fill="#5243aa"/></marker>
            <pattern id="wbGridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
              <line x1="0" y1="0" x2="20" y2="0" stroke="var(--kf-text-secondary)" stroke-width="1" stroke-opacity="0.3"/>
              <line x1="0" y1="0" x2="0" y2="20" stroke="var(--kf-text-secondary)" stroke-width="1" stroke-opacity="0.3"/>
            </pattern>
          </defs>
          <rect id="wbGridPage" class="kf-wb-grid-overlay hidden" x="0" y="0" width="1600" height="900" fill="var(--kf-surface-sunken, #f4f5f7)" stroke="var(--kf-border)" stroke-width="2"/>
          <rect id="wbGridOverlay" class="kf-wb-grid-overlay hidden" x="0" y="0" width="1600" height="900" fill="url(#wbGridPattern)"/>
          <g id="wbElementsLayer"></g>
          <g id="wbSelectionLayer" pointer-events="none"></g>
        </svg>
      </div>
    </div>
  </div>
</div>

<div class="kf-toast-wrap" id="toastWrap"></div>

<script type="module" src="app.js"></script>
</body>
</html>
